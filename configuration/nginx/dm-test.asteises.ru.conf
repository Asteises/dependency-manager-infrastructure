# HTTP -> HTTPS (с исключением для ACME)
server {
    listen 80;
    server_name dm-test.asteises.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dm-test;
        allow all;
    }

    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name dm-test.asteises.ru;

    ssl_certificate     /etc/letsencrypt/live/dm-test.asteises.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dm-test.asteises.ru/privkey.pem;

    # Заголовки безопасности
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header X-XSS-Protection "1; mode=block";

    # UI-статика
    location / {
        root /var/www/dm-test;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:2551/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}